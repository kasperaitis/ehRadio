name: Build and Release Firmware

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for required config files
        run: |
          MISSING_FILES=""
          if [ ! -f "builds/${{ github.repository_owner }}/platformio.ini" ]; then
            MISSING_FILES="${MISSING_FILES}platformio.ini "
          fi
          if [ ! -f "builds/${{ github.repository_owner }}/myoptions.h" ]; then
            MISSING_FILES="${MISSING_FILES}myoptions.h "
          fi
          if [ ! -f "builds/${{ github.repository_owner }}/releases.md" ]; then
            MISSING_FILES="${MISSING_FILES}releases.md "
          fi
          
          if [ -n "$MISSING_FILES" ]; then
            echo "❌ Error: Missing required files in builds/${{ github.repository_owner }}/"
            echo "Missing: $MISSING_FILES"
            echo ""
            echo "Required files:"
            echo "  - platformio.ini (build configuration)"
            echo "  - myoptions.h (hardware pin definitions)"
            echo "  - releases.md (release description)"
            exit 1
          fi
          echo "✅ All required contributor config files found for ${{ github.repository_owner }}"

      - name: Copy config files to project root
        run: |
          if [ -d "builds/${{ github.repository_owner }}" ]; then
            cp -rf builds/${{ github.repository_owner }}/* .
          fi

      - name: Prepare Gzipped Web Assets for Release
        run: |
          mkdir -p www_release
          for file in data/www/*; do
            filename=$(basename "$file")
            if [[ "$filename" == *.gz ]]; then
              echo "Copying $filename without compression (already gzipped)."
              cp "$file" "www_release/"
            elif [[ "$filename" == "rb_srvrs.json" ]]; then
              cp "$file" "www_release/"
              echo "Adding $filename without compression."
            else
              echo "Compressing $filename."
              gzip -c -9 "$file" > "www_release/$filename.gz"
            fi
          done

      - name: Prepare Gzipped Locale Files for Release
        run: |
          mkdir -p locale_release
          for file in src/locale/webui/*.json; do
            filename=$(basename "$file")
            echo "Compressing $filename."
            gzip -c -9 "$file" > "locale_release/$filename.gz"
          done

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Get version tag
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION=$(grep -oP '#define RADIOVERSION "\K[^"]+' src/core/options.h)
            TAG="${VERSION}"
            echo "Extracted version from options.h: ${VERSION}"
          else
            TAG=${GITHUB_REF#refs/tags/}
            VERSION=${TAG}
            echo "Using git tag: ${TAG}"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Final version: ${VERSION}"
          grep '#define RADIOVERSION ' src/core/options.h > version.txt

      - name: Install PlatformIO
        run: pip install platformio

      - name: Make binaries folder to stash .bin files
        run: mkdir -p binaries

      - name: Build all firmwares
        run: pio run

      - name: Rename firmware files with env name
        run: |
          for d in .pio/build/*/ ; do
            env=$(basename "$d")
            if [ -f "$d/firmware.bin" ]; then
              cp "$d/firmware.bin" "binaries/${env}.bin"
            fi
          done

      - name: Save bootloader/partitions for each board environment
        run: |
          # Extract all environments prefixed with 'board' from platformio.ini
          board_envs=$(grep -oP '(?<=\[env:board_)[^\]]+' platformio.ini | tr '\n' ' ')
          echo "Board environments: $board_envs"

          # Iterate over all board environments
          for env in $board_envs; do
            echo "Processing environment: $env"

            # Copy and rename bootloader and partitions binaries
            cp .pio/build/board_$env/bootloader.bin binaries/board_${env}_bootloader.bin
            cp .pio/build/board_$env/partitions.bin binaries/board_${env}_partitions.bin
          done

      - name: Build SPIFFS and extract for each board environment
        run: |
          # Extract all environments prefixed with 'board' from platformio.ini
          board_envs=$(grep -oP '(?<=\[env:board_)[^\]]+' platformio.ini | tr '\n' ' ')
          echo "Board environments: $board_envs"

          # Iterate over all board environments
          for env in $board_envs; do
            echo "Processing environment: $env"

            # Build SPIFFS
            pio run --environment board_$env --target buildfs

            # Copy and rename SPIFFS binaries
            cp .pio/build/board_$env/spiffs.bin binaries/board_${env}_spiffs.bin

          done

      - name: Generate firmware.txt from myoptions.h
        run: |
          echo "📝 Generating firmware.txt from myoptions.h..."
          python3 << 'PYTHON_SCRIPT'
          import re
          
          with open('myoptions.h', 'r') as f:
              lines = f.readlines()
          
          firmware_entries = []
          i = 0
          while i < len(lines):
              line = lines[i]
              
              # Look for #define FIRMWARE "filename.bin" // "board", "chip", "contributor"
              firmware_match = re.match(r'^\s*#define FIRMWARE "([^"]+\.bin)"\s*//\s*(.+)', line)
              if firmware_match:
                  filename = firmware_match.group(1)
                  comment1 = firmware_match.group(2)
                  
                  # Skip board_ entries (bare boards without full config)
                  if filename.startswith('board_'):
                      i += 1
                      continue
                  
                  # Parse first comment for board, chip, contributor
                  fields1 = re.findall(r'"([^"]*)"', comment1)
                  
                  # Look for next line: #define FIRMWARE_NAME "description" // "url"
                  description = None
                  url = None
                  if i + 1 < len(lines):
                      name_match = re.match(r'^\s*#define FIRMWARE_NAME "([^"]+)"\s*//\s*"([^"]*)"', lines[i + 1])
                      if name_match:
                          description = name_match.group(1)
                          url = name_match.group(2)
                  
                  # For firmware.txt: need all 5 fields (board, chip, contributor, description, url)
                  if len(fields1) == 3 and description and url:
                      board_env, chip_family, contributor = fields1
                      fw_env = filename.replace('.bin', '')
                      friendly_name = f"{contributor} {description}"
                      line = f"{board_env}|{chip_family}|{fw_env}|{friendly_name}"
                      firmware_entries.append({
                          'filename': filename,
                          'board_env': board_env,
                          'chip_family': chip_family,
                          'contributor': contributor,
                          'description': description,
                          'url': url,
                          'fw_env': fw_env,
                          'line': line,
                          'complete': True
                      })
                      print(f"✅ {fw_env} (complete)")
                  elif len(fields1) == 3 and description:
                      # For releases.md: can use even without URL
                      board_env, chip_family, contributor = fields1
                      firmware_entries.append({
                          'filename': filename,
                          'contributor': contributor,
                          'description': description,
                          'url': url if url else None,
                          'complete': False
                      })
                      print(f"ℹ️  {filename} (incomplete - no URL, will appear in releases.md only)")
                  else:
                      print(f"⚠️  Skipping {filename}: missing required fields")
              
              i += 1
          
          # Write firmware.txt (only complete entries)
          complete_entries = [e for e in firmware_entries if e.get('complete')]
          with open('firmware.txt', 'w') as f:
              for entry in complete_entries:
                  f.write(entry['line'] + '\n')
          
          print(f"\n📝 Generated firmware.txt with {len(complete_entries)} entries")
          PYTHON_SCRIPT

      - name: Patch releases.md with firmware listings
        run: |
          echo "📝 Patching releases.md with firmware listings..."
          python3 << 'PYTHON_SCRIPT'
          import re
          
          # Read myoptions.h to get firmware info
          with open('myoptions.h', 'r') as f:
              lines = f.readlines()
          
          firmware_by_contributor = {}
          i = 0
          while i < len(lines):
              line = lines[i]
              
              # Look for #define FIRMWARE "filename.bin" // "board", "chip", "contributor"
              firmware_match = re.match(r'^\s*#define FIRMWARE "([^"]+\.bin)"\s*//\s*(.+)', line)
              if firmware_match:
                  filename = firmware_match.group(1)
                  comment1 = firmware_match.group(2)
                  
                  # Skip board_ entries
                  if filename.startswith('board_'):
                      i += 1
                      continue
                  
                  # Parse first comment for board, chip, contributor
                  fields1 = re.findall(r'"([^"]*)"', comment1)
                  
                  if len(fields1) >= 3:
                      board_env, chip_family, contributor = fields1[:3]
                      
                      # Look for next line: #define FIRMWARE_NAME "description" // "url"
                      description = None
                      url = None
                      if i + 1 < len(lines):
                          name_match = re.match(r'^\s*#define FIRMWARE_NAME "([^"]+)"\s*//\s*"([^"]*)"', lines[i + 1])
                          if name_match:
                              description = name_match.group(1)
                              url = name_match.group(2) if name_match.group(2) else None
                      
                      if description:
                          if contributor not in firmware_by_contributor:
                              firmware_by_contributor[contributor] = []
                          
                          firmware_by_contributor[contributor].append({
                              'filename': filename,
                              'url': url,
                              'description': description
                          })
              
              i += 1
          
          # Read releases.md
          releases_file = f"builds/${{ github.repository_owner }}/releases.md"
          with open(releases_file, 'r') as f:
              lines = f.readlines()
          
          # Process releases.md
          new_lines = []
          i = 0
          while i < len(lines):
              line = lines[i]
              
              # Check for ### <Contributor> Firmware pattern
              match = re.match(r'^### (\w+) Firmware\s*$', line)
              if match:
                  contributor = match.group(1)
                  new_lines.append(line)  # Keep the header
                  i += 1
                  
                  # Skip existing firmware entries (lines starting with "  - ")
                  while i < len(lines) and lines[i].strip().startswith('- '):
                      i += 1
                  
                  # Add new firmware entries if we have them for this contributor
                  if contributor in firmware_by_contributor:
                      for fw in firmware_by_contributor[contributor]:
                          if fw['url']:
                              # With URL - create link
                              entry_line = f"  - [`{fw['filename']}`]({fw['url']})\n"
                          else:
                              # Without URL - just the filename
                              entry_line = f"  - `{fw['filename']}`\n"
                          new_lines.append(entry_line)
                      print(f"✅ Updated {contributor} section with {len(firmware_by_contributor[contributor])} entries")
                  else:
                      print(f"⚠️  No firmware found for {contributor}")
                  
                  continue
              
              new_lines.append(line)
              i += 1
          
          # Write updated releases.md
          with open(releases_file, 'w') as f:
              f.writelines(new_lines)
          
          print(f"\n📝 Patched releases.md")
          PYTHON_SCRIPT

      - name: Load release body text
        id: release_body
        run: |
          echo "Using release body from builds/${{ github.repository_owner }}/releases.md"
          # Read the file and set as multiline output
          echo "body<<EOF" >> $GITHUB_OUTPUT
          cat "builds/${{ github.repository_owner }}/releases.md" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Commit generated files to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Copy firmware.txt to the contributor's builds folder
          cp firmware.txt "builds/${{ github.repository_owner }}/firmware.txt"
          
          # Stage changes
          git add "builds/${{ github.repository_owner }}/firmware.txt"
          git add "builds/${{ github.repository_owner }}/releases.md"
          
          # Check if there are changes
          if git diff --cached --quiet; then
            echo "No changes to firmware.txt or releases.md"
          else
            COMMIT_MSG="Auto-generate firmware.txt and releases.md for ${{ steps.get_version.outputs.version }}"
            
            # Stash the staged changes
            git stash push -m "firmware.txt and releases.md update"
            
            # Commit to dev branch
            echo "📝 Committing to dev branch..."
            git fetch origin dev
            git checkout dev
            git stash pop
            git add "builds/${{ github.repository_owner }}/firmware.txt"
            git add "builds/${{ github.repository_owner }}/releases.md"
            git commit -m "$COMMIT_MSG"
            git push origin dev
            echo "✅ Committed to dev"
            
            # Commit to main branch
            echo "📝 Committing to main branch..."
            git fetch origin main
            git checkout main
            # Cherry-pick the commit we just made
            COMMIT_SHA=$(git rev-parse dev)
            git cherry-pick $COMMIT_SHA || {
              # If cherry-pick fails (e.g., already applied), copy files directly
              git checkout dev -- "builds/${{ github.repository_owner }}/firmware.txt" "builds/${{ github.repository_owner }}/releases.md"
              git add "builds/${{ github.repository_owner }}/firmware.txt"
              git add "builds/${{ github.repository_owner }}/releases.md"
              git commit -m "$COMMIT_MSG" || echo "No changes needed on main"
            }
            git push origin main
            echo "✅ Committed to main"
          fi

      - name: Organize firmware for ESP Web Tools
        run: |
          echo "📦 Organizing firmware for ESP Web Tools manifests..."
          mkdir -p firmware
          
          # Extract unique board environments and copy bootloader/partitions
          BOARD_ENVS=$(awk -F'|' '{print $1}' firmware.txt | sort -u)
          for board_env in $BOARD_ENVS; do
            echo "📋 Copying shared files for $board_env..."
            mkdir -p "firmware/$board_env"
            cp "binaries/${board_env}_bootloader.bin" "firmware/$board_env/bootloader.bin"
            cp "binaries/${board_env}_partitions.bin" "firmware/$board_env/partitions.bin"
            echo "✅ $board_env: bootloader + partitions"
          done
          
          # Copy individual firmware binaries
          while IFS='|' read -r board_env chip_family fw_env friendly_name; do
            echo "📦 Copying firmware: $fw_env"
            mkdir -p "firmware/$fw_env"
            if [ -f "binaries/${fw_env}.bin" ]; then
              cp "binaries/${fw_env}.bin" "firmware/$fw_env/firmware.bin"
              echo "✅ $fw_env: firmware.bin"
            else
              echo "❌ Warning: firmware.bin not found for $fw_env"
            fi
          done < firmware.txt
          
          echo "📦 Firmware organization complete"

      - name: Generate ESP Web Tools manifests
        run: |
          echo "📝 Generating ESP Web Tools manifests..."
          mkdir -p "builds/${{ github.repository_owner }}/web_assets/manifests"
          
          # Generate manifest for each firmware
          while IFS='|' read -r board_env chip_family fw_env friendly_name; do
            echo "Creating manifest for: $friendly_name"
            
            # Determine bootloader offset based on chip family
            BL_OFFSET=4096
            if [[ "$chip_family" == "ESP32-S3" || "$chip_family" == "ESP32-C3" ]]; then
              BL_OFFSET=0
            fi

            manifest_file="builds/${{ github.repository_owner }}/web_assets/manifests/${fw_env}-manifest.json"
            echo '{' > "$manifest_file"
            echo "  \"name\": \"ehRadio - ${friendly_name}\"," >> "$manifest_file"
            echo '  "version": "${{ steps.get_version.outputs.version }}",' >> "$manifest_file"
            # To enable "Add to Home Assistant" button, uncomment the line below. 
            # Note: The integration currently requires manual configuration and MQTT.
            # echo '  "home_assistant_domain": "ehradio",' >> "$manifest_file"
            echo '  "funding_url": "https://github.com/sponsors/trip5",' >> "$manifest_file"
            echo '  "builds": [' >> "$manifest_file"
            echo '    {' >> "$manifest_file"
            echo "      \"chipFamily\": \"${chip_family}\"," >> "$manifest_file"
            echo '      "parts": [' >> "$manifest_file"
            echo '        {' >> "$manifest_file"
            echo "          \"path\": \"../firmware/${board_env}_bootloader.bin\"," >> "$manifest_file"
            echo "          \"offset\": ${BL_OFFSET}" >> "$manifest_file"
            echo '        },' >> "$manifest_file"
            echo '        {' >> "$manifest_file"
            echo "          \"path\": \"../firmware/${board_env}_partitions.bin\"," >> "$manifest_file"
            echo '          "offset": 32768' >> "$manifest_file"
            echo '        },' >> "$manifest_file"
            echo '        {' >> "$manifest_file"
            echo "          \"path\": \"../firmware/${fw_env}.bin\"," >> "$manifest_file"
            echo '          "offset": 65536' >> "$manifest_file"
            echo '        }' >> "$manifest_file"
            echo '      ]' >> "$manifest_file"
            echo '    }' >> "$manifest_file"
            echo '  ]' >> "$manifest_file"
            echo '}' >> "$manifest_file"
            echo "✅ Created $manifest_file"
          done < firmware.txt
          
          echo "📝 Manifests generated"

      - name: Generate firmware-info.json
        run: |
          echo "📝 Creating firmware-info.json..."
          BUILD_DATE=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
          
          echo '{' > "builds/${{ github.repository_owner }}/web_assets/firmware-info.json"
          echo '  "project": "ehRadio",' >> "builds/${{ github.repository_owner }}/web_assets/firmware-info.json"
          echo '  "version": "${{ steps.get_version.outputs.version }}",' >> "builds/${{ github.repository_owner }}/web_assets/firmware-info.json"
          echo "  \"build_date\": \"${BUILD_DATE}\"," >> "builds/${{ github.repository_owner }}/web_assets/firmware-info.json"
          echo '  "variants": [' >> "builds/${{ github.repository_owner }}/web_assets/firmware-info.json"
          
          # Add firmware variants
          FIRST=true
          while IFS='|' read -r board_env chip_family fw_env friendly_name; do
            if [ "$FIRST" = "false" ]; then
              echo "  ," >> "builds/${{ github.repository_owner }}/web_assets/firmware-info.json"
            fi
            FIRST=false
            
            echo '  {' >> "builds/${{ github.repository_owner }}/web_assets/firmware-info.json"
            echo "    \"name\": \"${friendly_name}\"," >> "builds/${{ github.repository_owner }}/web_assets/firmware-info.json"
            echo "    \"manifest\": \"manifests/${fw_env}-manifest.json\"," >> "builds/${{ github.repository_owner }}/web_assets/firmware-info.json"
            echo "    \"description\": \"ehRadio - ${fw_env}\"" >> "builds/${{ github.repository_owner }}/web_assets/firmware-info.json"
            echo '  }' >> "builds/${{ github.repository_owner }}/web_assets/firmware-info.json"
          done < firmware.txt
          
          echo '  ]' >> "builds/${{ github.repository_owner }}/web_assets/firmware-info.json"
          echo '}' >> "builds/${{ github.repository_owner }}/web_assets/firmware-info.json"
          
          echo "✅ firmware-info.json created"
          cat "builds/${{ github.repository_owner }}/web_assets/firmware-info.json"

      - name: Commit web assets to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Stage changes first
          git add "builds/${{ github.repository_owner }}/web_assets/"
          
          # Check if there are changes
          if git diff --cached --quiet; then
            echo "No changes to web assets"
          else
            COMMIT_MSG="Update web assets for ${{ steps.get_version.outputs.version }}"
            
            # Stash the staged changes
            git stash push -m "web assets update"
            
            # Commit to dev branch
            echo "📝 Committing to dev branch..."
            git fetch origin dev
            git checkout dev
            git stash pop
            git add "builds/${{ github.repository_owner }}/web_assets/"
            git commit -m "$COMMIT_MSG"
            git push origin dev
            echo "✅ Committed to dev"
            
            # Commit to main branch
            echo "📝 Committing to main branch..."
            git fetch origin main
            git checkout main
            # Cherry-pick the commit we just made
            COMMIT_SHA=$(git rev-parse dev)
            git cherry-pick $COMMIT_SHA || {
              # If cherry-pick fails (e.g., already applied), copy files directly
              git checkout dev -- "builds/${{ github.repository_owner }}/web_assets/"
              git add "builds/${{ github.repository_owner }}/web_assets/"
              git commit -m "$COMMIT_MSG" || echo "No changes needed on main"
            }
            git push origin main
            echo "✅ Committed to main"
          fi

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-binaries
          path: |
            binaries/*.bin
            firmware/**/*.bin
            www_release/*
            locale_release/*
            builds/${{ github.repository_owner }}/web_assets/**
          retention-days: 90

