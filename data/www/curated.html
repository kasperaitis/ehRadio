<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#e3d25f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="stylesheet" id="themeCSS" href="theme.css" type="text/css">
  <link rel="stylesheet" id="styleCSS" href="style.css" type="text/css">
  <title>ehRadio - Curated Lists</title>
</head>

<body>
  <div id="curatedcontent">
    <div id="curatedheader">
      <h2 class="searchtitle1" data-i18n="ttl_curated">Curated Lists</h2>
      <h2 class="searchtitle2"><a href="search.html" data-i18n="ttl_search">Search</a></h2>
    </div>
    
    <div id="loadSection">
      <input type="fb searchbutton" class="fb" id="loadListsBtn" value="Load Index" onclick="loadCuratedIndex(this)" data-i18n="btn_load_index"/>
    </div><!-- end of header area -->

    <div id="indexwrap" class="scrollable">
      <table class="stations" id="indexTable">
        <!-- Index rows will be dynamically added here -->
      </table>
    </div>

    <h3 class="sectiontitle" id="playlistSectionTitle" data-i18n="ttl_select_playlist">Select a Playlist</h3>
    <div id="listwrap" class="scrollable">
      <table class="stations" id="playlistTable">
      </table>
    </div>

    <!-- footer begins -->
    <div id="importSection">
      <button class="fb searchbutton" id="replaceBtn" disabled data-i18n="btn_replace_playlist">Replace Playlist</button>
      <button class="fb searchbutton" id="mergeBtn" disabled data-i18n="btn_merge_playlist">Merge with Playlist</button>
    </div>


    <div class="fb" id="curateddone" data-i18n="btn_done">Done</div>
    <div id="copy">Curated lists from <span id="curatedBy"></span></div>
  </div>
</body>

<script src="variables.js"></script>
<script src="curated_variables.js"></script>
<!-- i18n snippet -->
<script>
var i18n = {};
var _langCodes = ['en_US','be_BY','bg_BG','bs_BA','cs_CZ','da_DK','de_DE','el_GR','en_US','es_ES','et_EE','fi_FI','fr_FR','hr_HR','hu_HU','is_IS','kk_KZ','ky_KG','lt_LT','lv_LV','me_ME','mk_MK','mn_MN','nl_NL','no_NO','pl_PL','pt_PT','ro_RO','ru_RU','sk_SK','sl_SI','sr_RS','sv_SE','tg_TJ','tr_TR','uk_UA','uz_UZ'];
var _uiLangCode = (typeof uiLang !== 'undefined' && uiLang > 0 && uiLang < _langCodes.length) ? _langCodes[uiLang] : 'en_US';
var localePromise = (_uiLangCode !== 'en_US')
  ? fetch('locale/' + _uiLangCode + '.json?' + (typeof radioVersion !== 'undefined' ? radioVersion : ''))
      .then(function(r){ return r.ok ? r.json() : {}; })
      .then(function(data){ i18n = data; })
      .catch(function(){})
  : Promise.resolve();
function t(key) { var args = Array.prototype.slice.call(arguments, 1); var s = (i18n && i18n[key]) ? i18n[key] : key; args.forEach(function(a, i){ s = s.replace('{' + i + '}', a); }); return s; }
function applyI18n(root) { (root || document).querySelectorAll('[data-i18n]').forEach(function(el) { var key = el.dataset.i18n; var val = i18n[key]; if (!val) return; if (el.tagName === 'INPUT' && (el.type === 'button' || el.type === 'submit')) { el.value = val; } else if (el.tagName === 'INPUT' && el.placeholder !== undefined) { el.placeholder = val; } else { el.textContent = val; } }); document.documentElement.style.setProperty('--knob-off', '"' + t('lbl_off') + '"'); document.documentElement.style.setProperty('--knob-on', '"' + t('lbl_on') + '"'); }
localePromise.then(function(){ applyI18n(); });
</script>
<script>
  var v = '?v=' + radioVersion;
  document.getElementById('themeCSS').href = 'theme.css' + v;
  document.getElementById('styleCSS').href = 'style.css' + v;
  document.write('<script src="playstation.js' + v + '"><\/script>');
  document.write('<script src="curated.js' + v + '"><\/script>');
</script>

</html>
